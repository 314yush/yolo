name: Verify V2

on:
  pull_request:
  push:
    branches:
      - main
      - feat/avantis-v2-migration

jobs:
  verify-vectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Golden intent vectors
        run: npm run verify:vectors
      - name: Live tx-builder + pair catalog
        run: npm run verify:v2
        continue-on-error: true
