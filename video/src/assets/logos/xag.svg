<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Silver bar icon -->
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F0"/>
      <stop offset="50%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
    <linearGradient id="silverSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
  </defs>
  <!-- Top face of silver bar -->
  <polygon points="50,15 85,35 50,55 15,35" fill="url(#silverGradient)" stroke="#606060" stroke-width="2"/>
  <!-- Right side -->
  <polygon points="85,35 85,65 50,85 50,55" fill="url(#silverSide)" stroke="#606060" stroke-width="2"/>
  <!-- Left side -->
  <polygon points="15,35 50,55 50,85 15,65" fill="#808080" stroke="#606060" stroke-width="2"/>
  <!-- Shine effect -->
  <polygon points="50,20 70,32 50,44 30,32" fill="#FFFFFF" opacity="0.5"/>
</svg>
